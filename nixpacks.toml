# Railway/Nixpacks config for Python app
[phases.setup]
# Python runtime + pip explicitly installed to avoid "pip: command not found"
nixPkgs = ["python311", "python311Packages.pip"]

[phases.install]
# Use module invocation so install works even when pip binary isn't in PATH
cmds = ["python -m pip install --upgrade pip", "python -m pip install -r requirements.txt"]

[start]
cmd = "python site/backend/app.py"
